[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[project]
name = "langgraph_agent"
version = "0.1.0"
description = "Add your description here"
authors = [
  { name = "Miguel Villa Floran", email = "miguel.villafloran@gmail.com" },
]
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
  "dotenv>=0.9.9",
  "geopy>=2.4.1",
  "google-adk>=1.20.0",
  "langchain-google-genai>=3.0.3",
  "langgraph>=1.0.3",
  "typer>=0.20.0",
]

[tool.uv.sources]
langgraph_agent = { workspace = true }

[dependency-groups]
dev = ["pre-commit>=4.1.0", "ipykernel>=6.29.5"]

[project.scripts]
langgraph_agent = "langgraph_agent.cli:entrypoint"
